[project]
name = "bl4-resources-and-cooldowns"
version = "1.0.0"
authors = [{ name = "Squ1ggs" }]
description = """
Recovery and resource sliders for Borderlands 4: repair kits, shields, lifesteal, ammo regen. Mods menu + brc_* console. Optional BLImGui tab (Ctrl+Shift+F12). Client-side.
"""

[project.urls]
Repository = "https://github.com/Squ1ggs/Bl4SDKmods"

[tool.sdkmod]
name = "Resources & Cooldowns"
license = { name = "MIT", url = "https://choosealicense.com/licenses/mit/" }
version = "1.0.0"
download = "https://raw.githubusercontent.com/Squ1ggs/Bl4SDKmods/refs/heads/main/resources_and_cooldowns/resources_and_cooldowns.sdkmod"
coop_support = "ClientSide"
